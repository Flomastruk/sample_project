services:
  custom_service:
    # image: python:3.12-bookworm
    build:
      context: ../
      dockerfile: .devcontainer/Dockerfile
    container_name: custom_container_name
    restart: always
    tty: true
    # command: sleep infinity
    volumes:
      # this is the *bind* mount
      - ../:/workspace
      # this mirrors volume defined in top-level `volumes` section
      - data:/data
      # persists Claude Code memory/settings/credentials across rebuilds
      - claude-config:/home/${USER}/.claude
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
volumes:
  data:
  claude-config:
